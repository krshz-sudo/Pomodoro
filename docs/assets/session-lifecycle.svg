<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-label="Pomodoro session lifecycle flowchart"><defs><style>.t{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f5f5f5}.s{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b8bec8}.b{fill:#15181d;stroke:#3b414b;stroke-width:2}.d{fill:#1a1d22;stroke:#555d68;stroke-width:2}.l{stroke:#8b929d;stroke-width:2;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b929d"/></marker></defs><rect width="1100" height="700" fill="#0d0f12"/><text x="550" y="46" text-anchor="middle" class="t" font-size="25">Session Lifecycle</text><rect class="b" x="450" y="80" width="200" height="60" rx="30"/><text x="550" y="117" text-anchor="middle" class="t">Start</text><path class="l" d="M550 140 L550 190"/><rect class="b" x="390" y="190" width="320" height="70" rx="18"/><text x="550" y="218" text-anchor="middle" class="t">Running</text><text x="550" y="241" text-anchor="middle" class="s">Date-based end timestamp</text><path class="l" d="M550 260 L550 315"/><rect class="d" x="430" y="315" width="240" height="80" rx="18"/><text x="550" y="347" text-anchor="middle" class="t">Complete?</text><text x="550" y="372" text-anchor="middle" class="s">endDate ≤ now</text><path class="l" d="M430 355 L270 355 L270 430"/><text x="350" y="345" class="s">No</text><rect class="b" x="120" y="430" width="300" height="80" rx="18"/><text x="270" y="462" text-anchor="middle" class="t">Tick / refresh UI</text><text x="270" y="486" text-anchor="middle" class="s">Recalculate remaining time</text><path class="l" d="M270 430 L270 225 L390 225"/><path class="l" d="M670 355 L830 355 L830 430"/><text x="730" y="345" class="s">Yes</text><rect class="b" x="680" y="430" width="300" height="80" rx="18"/><text x="830" y="462" text-anchor="middle" class="t">Persist + notify</text><text x="830" y="486" text-anchor="middle" class="s">SwiftData • sound • haptics</text><path class="l" d="M830 510 L830 565"/><rect class="b" x="680" y="565" width="300" height="70" rx="18"/><text x="830" y="594" text-anchor="middle" class="t">Next session</text><text x="830" y="617" text-anchor="middle" class="s">Short / Long Break or Focus</text></svg>